name: costvolume_pyramid

opacity_mapping:
  initial: 0.0
  final: 0.0
  warm_up: 1

num_depth_candidates: 32
num_surfaces: 1

gaussians_per_pixel: 1

gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4

d_feature: 128

visualizer:
  num_samples: 8
  min_resolution: 256
  export_ply: false

# params for multi-view depth predictor
unimatch_weights_path: "checkpoints/gmdepth-scale1-resumeflowthings-scannet-5d9d7964.pth"
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1,1,1]
costvolume_unet_attn_res: []
depth_unet_feat_dim: 64
depth_unet_attn_res: []
depth_unet_channel_mult: [1, 1, 1]
downscale_factor: 4
shim_patch_size: 4

# MSH compression settings
# Supported targets:
#   target: "pre_refine"   -> compress the bundle before refine_unet (MVSplat-style)
#   target: "refine_out"   -> compress UNet features before the heads
#   target: "raw_gaussians" -> compress final to_gaussians output (old)
compression:
  enabled: false            # set to true to enable MSH compression
  N: 128                    # latent bottleneck channels
  M: 192                    # hyperprior expansion channels
  n_downsample_per_stage:   # spatial downsampling layers per stage
    - 2                     # stage0 (~32x44): 4x reduction
    - 2                     # stage1 (~64x88): 4x reduction
    - 3                     # stage2 (~128x176): 8x reduction
  lmbda: 0.001              # rate-distortion tradeoff (higher = more compression)
  target: "refine_out"      # "pre_refine", "refine_out", or "raw_gaussians"
  compress_sh_degree: 4     # only used if target=="raw_gaussians"
  codec_init_ckpt: null     # optional: transplant only MSH codec weights from this ckpt
  actual_consistent_quant: true  # train forward uses CompressAI dequantization
  entropy_aux_weight: 0.0   # set >0 to train EntropyBottleneck CDF calibration
